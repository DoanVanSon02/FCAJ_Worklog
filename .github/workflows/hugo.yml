name: Deploy Hugo website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install Hugo 0.111.1 Extended
        run: |
          mkdir -p "${RUNNER_TEMP}/hugo"
          curl -fL --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v0.111.1/hugo_extended_0.111.1_linux-amd64.tar.gz" \
            -o "${RUNNER_TEMP}/hugo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" \
            -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Build website
        working-directory: Workshop-template-master
        run: |
          hugo version
          hugo --minify --baseURL "https://doanvanson02.github.io/FCAJ_Worklog/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: Workshop-template-master/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5